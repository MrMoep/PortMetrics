# Lokale Entwicklung / optionaler Container-Test.
# Kein Registry-Push — Image-Build für Prod läuft nur auf main via GitHub Actions.

services:
  portmetrics:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      # Unraid: z.B. /mnt/user/appdata/portmetrics/logs:/app/logs
      - portmetrics_logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  portmetrics_logs:
