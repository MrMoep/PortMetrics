name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: portmetrics
          POSTGRES_PASSWORD: portmetrics
          POSTGRES_DB: portmetrics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portmetrics -d portmetrics_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://portmetrics:portmetrics@localhost:5432/portmetrics_test
      TEST_DATABASE_URL: postgresql+psycopg://portmetrics:portmetrics@localhost:5432/portmetrics_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        run: pytest --cov=portmetrics --cov-report=term-missing --cov-fail-under=70

  web:
    name: Web Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Vitest
        run: npm test
